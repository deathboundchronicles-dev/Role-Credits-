services:
  - type: web
    name: role-credits-broker
    runtime: node
    region: ohio
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PEER_PATH
        value: /peerjs
      - key: PEER_KEY
        value: rolecredits
